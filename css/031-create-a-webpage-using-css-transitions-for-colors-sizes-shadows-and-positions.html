<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using CSS transitions for colors, sizes, shadows, and positions.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .transition{width:120px;height:120px;background:#2563eb;transition:all .5s}.transition:hover{width:220px;box-shadow:0 15px 30px #0004;transform:translateX(20px)}</style>
</head>
<body>
<header><h1>Create a webpage using CSS transitions for colors, sizes, shadows, and positions.</h1><p>CSS practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><div class="transition"></div><p>Hover over the square.</p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script></script>
</body>
</html>
