<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using static, relative, absolute, fixed, and sticky positioning.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .stage{height:230px;position:relative}.relative{position:relative;left:20px}.absolute{position:absolute;right:20px;top:20px}.fixed{position:fixed;bottom:15px;right:15px;background:#2563eb;color:white;padding:10px;border-radius:8px}.sticky{position:sticky;top:0;background:#fde68a;padding:10px}</style>
</head>
<body>
<header><h1>Create a webpage using static, relative, absolute, fixed, and sticky positioning.</h1><p>CSS practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card stage"><div class="sticky">Sticky</div><div class="relative">Relative</div><div class="absolute">Absolute</div><div class="fixed">Fixed</div></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script></script>
</body>
</html>
