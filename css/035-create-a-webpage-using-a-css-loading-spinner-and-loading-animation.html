<title>Create a webpage using a CSS loading spinner and loading animation.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .spinner{width:60px;height:60px;border:7px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<header><h1>Create a webpage using a CSS loading spinner and loading animation.</h1><p>CSS practical demonstration</p></header>
