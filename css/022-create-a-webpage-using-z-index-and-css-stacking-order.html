<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using z-index and CSS stacking order.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .stack{height:180px;position:relative}.z1,.z2{position:absolute;padding:45px;border-radius:12px}.z1{z-index:2;background:#2563eb;color:white}.z2{z-index:1;background:#ec4899;left:60px;top:40px}</style>
</head>
<body>
<header><h1>Create a webpage using z-index and CSS stacking order.</h1><p>CSS practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><div class="stack"><div class="z1">z-index 2</div><div class="z2">z-index 1</div></div></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script></script>
</body>
</html>
