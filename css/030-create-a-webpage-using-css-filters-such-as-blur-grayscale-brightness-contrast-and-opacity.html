<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using CSS filters such as blur, grayscale, brightness, contrast, and opacity.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filters img{width:100%;border-radius:10px}.blur{filter:blur(4px)}.gray{filter:grayscale(1)}.contrast{filter:contrast(2)}</style>
</head>
<body>
<header><h1>Create a webpage using CSS filters such as blur, grayscale, brightness, contrast, and opacity.</h1><p>CSS practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card filters"><img src="https://picsum.photos/300/180?1" class="blur"><img src="https://picsum.photos/300/180?2" class="gray"><img src="https://picsum.photos/300/180?3" class="contrast"></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script></script>
</body>
</html>
