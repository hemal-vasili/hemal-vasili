<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a webpage using different CSS border styles, widths, colors, and border-radius properties.</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
    .demo-ui{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
    .demo-ui>*{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px}
    .borders{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.borders div{padding:20px;border:4px dashed #2563eb;border-radius:18px}</style>
</head>
<body>
<header><h1>Create a webpage using different CSS border styles, widths, colors, and border-radius properties.</h1><p>CSS practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card borders"><div>Dashed</div><div style="border-style:solid">Solid</div><div style="border-style:dotted">Dotted</div></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script></script>
</body>
</html>
