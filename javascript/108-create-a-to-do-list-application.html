<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a to-do list application.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Create a to-do list application.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="task" placeholder="Task"><button onclick="add()">Add</button><ul id="list"></ul></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function add(){let v=task.value.trim();if(!v)return;let li=document.createElement('li');li.textContent=v+' ';let b=document.createElement('button');b.textContent='Delete';b.onclick=()=>li.remove();li.appendChild(b);list.appendChild(li);task.value=''}</script>
</body>
</html>
