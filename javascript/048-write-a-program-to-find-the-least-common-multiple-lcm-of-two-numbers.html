<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to find the least common multiple (LCM) of two numbers.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a program to find the least common multiple (LCM) of two numbers.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="a" value="12"><input id="b" value="18"><button onclick="run()">LCM</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,x=a,y=b;while(y)[x,y]=[y,x%y];output.textContent=Math.abs(a*b)/x}</script>
</body>
</html>
