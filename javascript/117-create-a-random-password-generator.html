<body>
<header><h1>Create a random password generator.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><button onclick="run()">Generate Password</button><input id="output" readonly></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let s='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';let r='';for(let i=0;i<12;i++)r+=s[Math.floor(Math.random()*s.length)];output.value=r}</script>
</body>
