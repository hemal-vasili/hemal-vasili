<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a JavaScript program to perform arithmetic operations.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a JavaScript program to perform arithmetic operations.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="a" type="number" value="12"><input id="b" type="number" value="4"><button onclick="run()">Calculate</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;output.textContent=`Sum=${a+b}, Difference=${a-b}, Product=${a*b}, Quotient=${b?a/b:'undefined'}`}</script>
</body>
</html>
