<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a program using setInterval().</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Create a program using setInterval().</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><button onclick="run()">Start</button><p id="output">0</p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>let n=0,t;function run(){clearInterval(t);t=setInterval(()=>output.textContent=++n,1000)}</script>
</body>
