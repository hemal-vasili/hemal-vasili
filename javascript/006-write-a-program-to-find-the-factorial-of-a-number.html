<title>Write a program to find the factorial of a number.</title>

<body>
<header><h1>Write a program to find the factorial of a number.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="n" type="number" value="5"><button onclick="run()">Factorial</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let x=+n.value,r=1;for(let i=2;i<=x;i++)r*=i;output.textContent=r}</script>
</body>
