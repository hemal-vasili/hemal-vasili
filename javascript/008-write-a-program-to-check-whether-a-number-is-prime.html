<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to check whether a number is prime.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a program to check whether a number is prime.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="n" type="number" value="17"><button onclick="run()">Check</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let x=+n.value,p=x>1;for(let i=2;i*i<=x;i++)if(x%i===0)p=false;output.textContent=p?'Prime':'Not Prime'}</script>
</body>
</html>
