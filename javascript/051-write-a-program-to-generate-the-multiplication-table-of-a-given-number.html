<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to generate the multiplication table of a given number.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a program to generate the multiplication table of a given number.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="n" value="7"><button onclick="run()">Generate</button><pre id="output"></pre></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let x=+n.value,r='';for(let i=1;i<=10;i++)r+=`${x} × ${i} = ${x*i}\n`;output.textContent=r}</script>
</body>
</html>
