<title>Write a program to check whether a number is even or odd.</title>

<body>
<header><h1>Write a program to check whether a number is even or odd.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="n" type="number" value="8"><button onclick="run()">Check</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){output.textContent=(+n.value)%2===0?'Even':'Odd'}</script>
</body>
