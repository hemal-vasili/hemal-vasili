<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to generate the Fibonacci series.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a program to generate the Fibonacci series.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="n" type="number" value="8"><button onclick="run()">Generate</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let x=+n.value,a=0,b=1,r=[];for(let i=0;i<x;i++){r.push(a);[a,b]=[b,a+b]}output.textContent=r.join(', ')}</script>
</body>
</html>
