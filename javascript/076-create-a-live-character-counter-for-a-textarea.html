<head>

<body>
<header><h1>Create a live character counter for a textarea.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>

<div class="card"><textarea id="txt" rows="5" oninput="run()"></textarea><p id="output">0 characters</p></div>

<script>function run(){output.textContent=txt.value.length+' characters'}</script>
</body>
