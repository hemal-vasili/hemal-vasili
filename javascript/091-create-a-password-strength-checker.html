<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a password strength checker.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Create a password strength checker.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="p" type="password" oninput="run()" placeholder="Enter password"><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let p=document.getElementById('p').value,s=p.length>=8?1:0;s+=/[A-Z]/.test(p);s+=/[0-9]/.test(p);s+=/[^A-Za-z0-9]/.test(p);output.textContent=['Very weak','Weak','Medium','Strong','Very strong'][s]}</script>
</body>
</html>
