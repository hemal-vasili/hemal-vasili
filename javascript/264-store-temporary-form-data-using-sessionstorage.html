<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store temporary form data using sessionStorage.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Store temporary form data using sessionStorage.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="x" placeholder="Temporary data"><button onclick="save()">Save</button><button onclick="load()">Read</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function save(){sessionStorage.setItem('x',x.value);output.textContent='Saved.'}function load(){output.textContent=sessionStorage.getItem('x')||'No session data'}</script>
</body>
</html>
