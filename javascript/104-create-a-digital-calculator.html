<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a digital calculator.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Create a digital calculator.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="a" type="number" value="10"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number" value="5"><button onclick="run()">Calculate</button><h2 id="output"></h2></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value,o=document.getElementById('op').value;output.textContent=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b}</script>
</body>
</html>
