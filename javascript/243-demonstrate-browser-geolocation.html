<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstrate browser geolocation.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Demonstrate browser geolocation.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><button onclick="run()">Get Coordinates</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>output.textContent=`Latitude: ${p.coords.latitude}\nLongitude: ${p.coords.longitude}`,e=>output.textContent=e.message):output.textContent='Not supported'}</script>
</body>
</html>
