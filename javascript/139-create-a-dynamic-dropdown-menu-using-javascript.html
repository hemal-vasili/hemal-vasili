<body>
<header><h1>Create a dynamic dropdown menu using JavaScript.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
