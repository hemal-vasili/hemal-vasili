<body>
<header><h1>Create a counter application with increment and decrement buttons.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><h2 id="count">0</h2><button onclick="change(1)">+</button><button onclick="change(-1)">−</button></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>let c=0;function change(x){c+=x;count.textContent=c}</script>
</body>
