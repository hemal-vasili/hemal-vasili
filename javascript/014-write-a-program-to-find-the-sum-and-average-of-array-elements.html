<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write a program to find the sum and average of array elements.</title>
<link rel="stylesheet" href="../assets/style.css">
<style></style>
</head>
<body>
<header><h1>Write a program to find the sum and average of array elements.</h1><p>JavaScript practical demonstration</p></header>
<main>
<div class="card">
<nav><a href="../index.html">Home</a><a class="secondary" href="../index.html">Back to Programs</a></nav>
</div>
<div class="card"><input id="a" value="10,20,30,40"><button onclick="run()">Calculate</button><p id="output"></p></div>
</main>
<footer>HTML • CSS • JavaScript Practical Programs</footer>
<script>function run(){let a=document.getElementById('a').value.split(',').map(Number),s=a.reduce((x,y)=>x+y,0);output.textContent=`Sum=${s}, Average=${s/a.length}`}</script>
</body>
</html>
